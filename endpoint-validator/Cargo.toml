[package]
name = "endpoint-validator"
version = "0.1.1"
edition = "2024"
description = "Interactive test harness for endpoint-libs WebSocket RPC services: reads the endpoint description generated by endpoint-gen and calls any endpoint by hand."
repository = "https://github.com/pathscale/EndpointValidator"
homepage = "https://github.com/pathscale/EndpointValidator"
license = "MIT"
readme = "README.md"
keywords = ["websocket", "rpc", "testing", "tui", "endpoint-libs"]
categories = ["development-tools::testing", "command-line-utilities"]

[lib]
name = "endpoint_validator"
path = "src/lib.rs"

[[bin]]
name = "endpoint-validator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28.1"
endpoint-libs = { version = "^3", features = ["ws-client", "ws-client-tls"] }
eyre = "0.6"
futures = "0.3"
nagoya = { version = "^0.1", default-features = false, features = ["reactor"] }
ratatui = "0.20.0"
read_input = "0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
