[package]
name = "endpoint_validator"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
config = "0.14"
futures = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "serde_json", "json"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = { version = "0.20.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "*"
uuid = { version = "1.3", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
read_input = "0.8"
ratatui = "0.20"
crossterm = "0.28"
clap = { version = "4.0", features = ["derive"] }
async-trait = "0.1"
eyre = "0.6"
endpoint-libs = {git = "https://github.com/pathscale/endpoint-libs.git", branch = "main"}