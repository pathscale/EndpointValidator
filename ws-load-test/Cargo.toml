[package]
name = "ws-load-test"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ws-simple"
path = "src/bin/ws_simple.rs"

[dependencies]
endpoint-libs = { version = "1.4", features = ["ws"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
rustls = "0.23"
core_affinity = "0.8"
hdrhistogram = "7"
num_cpus = "1"
